[workspace]
resolver = "3"
members = [
    "backend",
    "backend-core",
    "migrations"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Papi <papi@ragoenterprises.com>"]
description = "Rago Enterprises CRM"

[workspace.dependencies]
tokio = { version = "1.42", features = ["full"] }
axum = "0.8.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.13"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "offline"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }